[project]
name = "taraqueue"
dynamic = ["version"]
description = "Python queue abstraction layer"
authors = [
    {name = "Marc Tardif", email = "marc@taram.ca"},
]
readme = "README.rst"
requires-python = ">=3.12,<4.0"
dependencies = [
    "yarl>=1.23.0",
]

[project.urls]
Repository = "https://github.com/taradix/taraqueue"

[project.optional-dependencies]

redis = [
    "redis>=7.4.0",
]

sqs = [
    "aiobotocore>=2.21.0",
]

test = [
    "aiobotocore>=2.21.0",
    "coverage>=7.2.3,<8.0.0",
    "more-itertools>=11.0.1,<11.1.0",
    "redis>=7.4.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-unique>=0.1.8,<1.0.0",
    "pytest-xdocker>=0.2.8,<1.0.0",
]

check = [
    "ruff>=0.15.0,<1.0.0",
]

docs = [
    "sphinx>=9.0.0,<10.0.0",
    "sphinxcontrib-log-cabinet>=1.0.1,<2.0.0",
    "sphinx-rtd-theme>=3.1.0,<3.2.0",
]

[project.entry-points."pytest11"]
taraqueue-services = "taraqueue.testing.services"
taraqueue-queue = "taraqueue.testing.queue"

[project.entry-points."taraqueue"]
memory = "taraqueue.memory:MemoryQueue"
redis = "taraqueue.redis:RedisQueue"
sqs = "taraqueue.sqs:SQSQueue"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Create your own exception
    "TRY002",
    # Avoid specifying long messages outside the exception class
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]

# Pytest options:
#   https://docs.pytest.org/en/6.2.x/reference.html#ini-options-ref
[tool.pytest.ini_options]
addopts = [
    "--doctest-modules",
    "--doctest-glob=*.rst",
]
asyncio_mode = "auto"
testpaths = [
    "taraqueue",
    "docs",
    "tests",
]

# Coverage options:
#   https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.paths]
source = [
    "taraqueue",
    "*/*/site-packages",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.coverage.run]
branch = true
parallel = true
source = [
    "taraqueue",
]
